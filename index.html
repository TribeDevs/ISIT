                                    <img src="./src/images/games/cs2.png" alt="перейти к турнирам"
                                        class="slider__item-img"></img>
                                </a>
                                <a href="/tournaments&game_id=1" class="slider__item">
                                    <img src="./src/images/games/cs2.png" alt="перейти к турнирам"
                                        class="slider__item-img"></img>
                                </a>
                                <a href="/tournaments&game_id=1" class="slider__item">
                                    <img src="./src/images/games/cs2.png" alt="перейти к турнирам"
                                        class="slider__item-img"></img>
                                </a>
                            </div>
                            <div class="slider__page">
                                <a href="/tournaments&game_id=1" class="slider__item">
                                    <img src="./src/images/games/cs2.png" alt="перейти к турнирам"

                        <div class="slider__nav-pages">

                                    <a href="/tournaments/1" class="tournaments-item__link">

                                    </a>
                                </div>
                            </div>
                            <div class="tournaments-item">
                                <div class="tournaments-item__name">SibFU Spring Cup 2047</div>
                                <div class="tournaments-item__meta">
                                    <div class="tournaments-item__participants gr-green">13/20</div>
                                    <a href="/tournaments/1" class="tournaments-item__link">
                                        <img src="./src/images/icons/arrow-next.svg" alt="подробнее"
                                            class="tournaments-item__link-arrow">
                                    </a>
                                </div>
                            </div>
                            <div class="tournaments-item">
                                <div class="tournaments-item__name">SibFU Spring Cup 2047</div>
                                <div class="tournaments-item__meta">
                                    <div class="tournaments-item__participants gr-red">2/9</div>
                                    <a href="/tournaments/1" class="tournaments-item__link">
                                        <img src="./src/images/icons/arrow-next.svg" alt="подробнее"
                                            class="tournaments-item__link-arrow">
                                    </a>
                                </div>
                            </div>
                            <div class="tournaments-item">
                                <div class="tournaments-item__name">SibFU Spring Cup 2047</div>
                                <div class="tournaments-item__meta">
                                    <div class="tournaments-item__participants gr-red">13/20</div>
                                    <a href="/tournaments/1" class="tournaments-item__link">

                    <a href="/tournaments" class="page-row__all-link">ВСЕ ТУРНИРЫ</a>
                </div>
            </div>
        </div>
    </div>



    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const track = document.querySelector('.slider__track');
            const slider = document.querySelector('.slider__items'); // Добавляем элемент слайдера
            const items = document.querySelectorAll('.slider__page');
            const prevBtn = document.querySelector('.slider__nav-arrow_prev');
            const nextBtn = document.querySelector('.slider__nav-arrow_next');
            const pagesContainer = document.querySelector('.slider__nav-pages');

            let currentIndex = 0;
            const itemCount = items.length;
            let startX = 0;
            let isDragging = false;

            // Создаем точки навигации
            items.forEach((_, index) => {
                const pageDot = document.createElement('div');
                pageDot.classList.add('slider__nav-page');
                if (index === 0) pageDot.classList.add('active');
                pageDot.dataset.index = index;
                pagesContainer.appendChild(pageDot);
            });

            const pageDots = document.querySelectorAll('.slider__nav-page');

            // Функция обновления слайдера
            function updateSlider() {
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
                track.style.transition = isDragging ? 'none' : 'transform 0.5s ease';

                // Обновляем активную точку
                pageDots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === currentIndex);
                });
            }

            // Переключение по стрелкам
            prevBtn.addEventListener('click', () => {
                currentIndex = (currentIndex > 0) ? currentIndex - 1 : itemCount - 1;
                updateSlider();
            });

            nextBtn.addEventListener('click', () => {
                currentIndex = (currentIndex < itemCount - 1) ? currentIndex + 1 : 0;
                updateSlider();
            });

            // Переключение по точкам
            pageDots.forEach(dot => {
                dot.addEventListener('click', () => {
                    currentIndex = parseInt(dot.dataset.index);
                    updateSlider();
                });
            });

            // Добавляем обработчики для touch-устройств
            slider.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                isDragging = true;
            }, { passive: true });

            slider.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const x = e.touches[0].clientX;
                const diff = startX - x;
                track.style.transform = `translateX(calc(-${currentIndex * 100}% - ${diff}px))`;
            }, { passive: true });

            slider.addEventListener('touchend', (e) => {
                if (!isDragging) return;
                isDragging = false;

                const endX = e.changedTouches[0].clientX;
                const diff = startX - endX;

                if (diff > 50) {
                    // Свайп влево - вперед
                    currentIndex = (currentIndex < itemCount - 1) ? currentIndex + 1 : 0;
                } else if (diff < -50) {
                    // Свайп вправо - назад
                    currentIndex = (currentIndex > 0) ? currentIndex - 1 : itemCount - 1;
                }

                updateSlider();
            });
        });
    </script>
</body>

</html>
